<div class="dashboard-container">

  <h1>DevDynamics</h1>

  <!-- FILTERS -->
  <section class="filters">

    <div class="filter-field">
      <label>Start Date</label>
      <input type="date" [(ngModel)]="startDate" (change)="onFiltersChanged()" />
    </div>

    <div class="filter-field">
      <label>End Date</label>
      <input type="date" [(ngModel)]="endDate" (change)="onFiltersChanged()" />
    </div>

    <div class="filter-field">
      <label>Contributor</label>

      <div class="custom-select" [class.open]="dropdownOpen">

        <div class="custom-select__trigger"
             (click)="$event.stopPropagation(); dropdownOpen = !dropdownOpen">

          <span>{{ contributor || 'All Contributors' }}</span>
          <span>▼</span>

        </div>

        <div class="custom-select__options">

          <div class="custom-option" (click)="selectContributor('')">
            All Contributors
          </div>

          <div *ngFor="let item of contributors"
               class="custom-option"
               (click)="selectContributor(item)">
            {{ item }}
          </div>

        </div>
      </div>
    </div>

  </section>

  <!-- 🔥 SKELETON -->
  <section *ngIf="loading" class="skeleton-container">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-chart"></div>
  </section>

  <!-- DATE ERROR -->
  <section *ngIf="dateRangeMessage">
    <p>{{ dateRangeMessage }}</p>
  </section>

  <!-- API ERROR -->
  <section *ngIf="errorMessage">
    <p>{{ errorMessage }}</p>
  </section>

  <!-- EMPTY -->
  <section *ngIf="hasNoData && !loading">
    <p>No data found. Try adjusting filters.</p>
  </section>

  <!-- DATA -->
  <ng-container *ngIf="!loading && !hasNoData">

    <section class="summary-section">
      <h2>Summary</h2>
      <p>Commits: {{ summary.totalCommits }}</p>
      <p>PRs: {{ summary.totalPRs }}</p>
      <p>Merges: {{ summary.totalMerges }}</p>
    </section>

    <section class="chart-section">
      <ngx-charts-line-chart
        [results]="commitFrequencyData"
        [view]="[900,300]">
      </ngx-charts-line-chart>
    </section>

  </ng-container>

</div>
