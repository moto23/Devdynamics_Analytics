<div class="signup-container">
  <h1>Signup</h1>
  <p class="subtitle">Demo form only. No backend integration.</p>

  <form (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" [(ngModel)]="name" name="name" required />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" required />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        required
      />
    </div>

    <button type="submit">Create Account</button>
  </form>

  @if (submitted) {
    <div class="success">Form submitted (frontend only).</div>
  }

  <a routerLink="/" class="back-link">Back to Dashboard</a>
</div>
